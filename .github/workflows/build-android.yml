name: Build ATLAS WILDS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract supplied wildlife models
        run: |
          mkdir -p assets
          BEAR_ZIP=""
          if [ -f ATLAS_WILDS_Polar_Bear_Enhanced.zip ]; then
            BEAR_ZIP="ATLAS_WILDS_Polar_Bear_Enhanced.zip"
          elif [ -f ATLAS_WILDS_Polar_Bear_3D.zip ]; then
            BEAR_ZIP="ATLAS_WILDS_Polar_Bear_3D.zip"
          fi
          if [ -n "$BEAR_ZIP" ]; then
            mkdir -p /tmp/atlas-bear
            unzip -oq "$BEAR_ZIP" -d /tmp/atlas-bear
            BEAR_MODEL="$(find /tmp/atlas-bear -type f -iname '*.glb' | head -n 1)"
            if [ -n "$BEAR_MODEL" ]; then
              cp "$BEAR_MODEL" assets/Polar_Bear.glb
              echo "Polar bear model installed from $BEAR_MODEL."
            else
              echo "WARNING: No GLB model found in $BEAR_ZIP."
            fi
          else
            echo "Polar bear ZIP not uploaded; game will use its placeholder."
          fi
          if [ -f ATLAS_WILDS_Ice_Dragon_3D.zip ]; then
            mkdir -p /tmp/atlas-dragon
            unzip -oq ATLAS_WILDS_Ice_Dragon_3D.zip -d /tmp/atlas-dragon
            DRAGON_MODEL="$(find /tmp/atlas-dragon -type f -iname '*.glb' | head -n 1)"
            if [ -n "$DRAGON_MODEL" ]; then
              cp "$DRAGON_MODEL" assets/ATLAS_WILDS_Ice_Dragon.glb
              echo "Ice dragon model installed from $DRAGON_MODEL."
            else
              echo "WARNING: No GLB model found in dragon ZIP."
            fi
          else
            echo "Ice dragon ZIP not uploaded; game will use its placeholder."
          fi

      - name: Install Java and Android export templates
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip wget
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          else
            echo "ERROR: Android sdkmanager was not found in the build container."
            exit 1
          fi
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Installed Android SDK packages:"
          ls -la "$ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME/platforms/android-34"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"
          ls -la "$ANDROID_HOME/cmdline-tools/latest"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

      - name: Create build directory
        run: mkdir -p build

      - name: Check tools
        run: |
          godot --version
          java -version
          test -d "$ANDROID_HOME"

      - name: Import project resources and validate scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" /tmp/godot-import.log; then
            echo "ERROR: Godot reported script errors; refusing to export a broken APK."
            exit 1
          fi
        shell: bash

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/atlas-wilds-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-wilds-android-debug
          path: build/atlas-wilds-debug.apk
          if-no-files-found: error
          retention-days: 14
