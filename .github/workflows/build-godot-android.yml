name: Build ATLAS WILDS Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "GodotPrototype/**"
      - ".github/workflows/build-godot-android.yml"
      - "assets/**"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -a /root/.config/godot ~/.config/godot
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Stage uploaded GLB models
        run: cp -a assets GodotPrototype/assets

      - name: Import project assets and validate scripts
        run: |
          set -o pipefail
          godot --headless --editor --path GodotPrototype --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "Godot script validation failed during import."
            exit 1
          fi
          godot --headless --path GodotPrototype --quit-after 3 2>&1 | tee /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR: Failed to load" /tmp/godot-runtime.log; then
            echo "Godot startup validation failed."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p GodotPrototype/build
          godot --headless --path GodotPrototype --export-debug "Android Debug" "$(pwd)/GodotPrototype/build/ATLAS-WILDS-ARENA-test.apk"

      - name: Verify APK
        run: |
          test -s GodotPrototype/build/ATLAS-WILDS-ARENA-test.apk
          ls -lh GodotPrototype/build/ATLAS-WILDS-ARENA-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-WILDS-ARENA-test-APK
          path: GodotPrototype/build/ATLAS-WILDS-ARENA-test.apk
          if-no-files-found: error
          retention-days: 14
