name: Build ATLAS WILDS ARENA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prepare_android.py"
      - "dragon_realm_godot_v3.zip"
      - "assets/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android export packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare project, integrate GLB animals and export APK
        run: |
          set -e
          python3 prepare_android.py

          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/opt/android-sdk"
          export/android/java_sdk_path = "/opt/java/openjdk"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          docker run --rm \
            -e HOME=/root \
            -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_SDK_ROOT=/opt/android-sdk \
            -e JAVA_HOME=/opt/java/openjdk \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$ANDROID_HOME:/opt/android-sdk" \
            -v "$JAVA_HOME:/opt/java/openjdk" \
            -v "$HOME/.config/godot:/root/.config/godot" \
            -v "$HOME/.android:/root/.android" \
            -w /workspace \
            barichello/godot-ci:4.2.2 \
            bash -lc '
              set -e
              PROJECT="build_project/dragon_realm_v3"
              echo "=== Install Godot Android build template ==="
              godot --headless --editor --path "$PROJECT" --install-android-build-template
              echo "=== Import project resources ==="
              godot --headless --path "$PROJECT" --editor --import --quit
              test -d "$PROJECT/android/build" || { echo "Android Gradle build template directory was not created"; exit 1; }
              mkdir -p "$PROJECT/build"
              echo "=== Godot version ==="
              godot --version
              echo "=== Android SDK tools ==="
              ls -la /opt/android-sdk/build-tools/33.0.2 || true
              echo "=== Godot export templates ==="
              find /root/.local/share/godot -maxdepth 4 -type f 2>/dev/null | head -80 || true
              echo "=== Export preset ==="
              cat "$PROJECT/export_presets.cfg"
              mkdir -p "$PROJECT/build"
              set +e
              godot --headless --verbose --path "$PROJECT" --export-debug "Android" "$PROJECT/build/ATLAS_WILDS_ARENA.apk" 2>&1 | tee /workspace/android-export.log
              export_status=${PIPESTATUS[0]}
              set -e
              if [ "$export_status" -ne 0 ]; then
                echo "Android export failed with exit code $export_status"
                grep -Ein "error|fail|missing|invalid|template|sdk|keystore|icon" /workspace/android-export.log | tail -120 || true
                exit "$export_status"
              fi
              test -s "$PROJECT/build/ATLAS_WILDS_ARENA.apk"
              ls -lh "$PROJECT/build/ATLAS_WILDS_ARENA.apk"
            '

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-WILDS-ARENA-APK
          path: build_project/dragon_realm_v3/build/ATLAS_WILDS_ARENA.apk
          if-no-files-found: error
          retention-days: 3
