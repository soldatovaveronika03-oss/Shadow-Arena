name: Build Blender Environment Assets
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "BlenderPreview/**"
      - ".github/workflows/blender-environment-preview.yml"

permissions:
  contents: write

jobs:
  build-environment:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Generate Blender tree models and previews
        run: |
          mkdir -p output
          blender -b -t 2 --python BlenderPreview/create_trees.py
          test -s output/Tree_Old_Oak.glb
          test -s output/Tree_Young_Birch.glb
          test -s output/Tree_Wide_Ancient.glb
          test -s output/Tree_Pine.glb

      - name: Add generated GLB models to the Godot project
        run: |
          mkdir -p GodotPrototype/assets/generated
          cp output/*.glb GodotPrototype/assets/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GodotPrototype/assets/generated/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add Blender-generated environment tree models"
            git push
          else
            echo "Generated models are unchanged."
          fi

      - name: Upload GLB models and image previews
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-WILDS-BLENDER-TREES
          path: output/
          if-no-files-found: error
          retention-days: 14
