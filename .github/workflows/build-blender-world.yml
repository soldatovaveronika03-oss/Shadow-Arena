name: Build Blender World Assets
on:
  workflow_dispatch:
  push:
    paths:
      - "Blender/create_atlas_world.py"
      - ".github/workflows/build-blender-world.yml"
permissions:
  contents: write
jobs:
  build-world:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz -O /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-4.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Generate world models
        run: |
          blender -b -t 2 --python Blender/create_atlas_world.py
          test "$(find /tmp/atlas_world_assets -name '*.glb' | wc -l)" -ge 10
          mkdir -p GodotPrototype/assets/world
          cp /tmp/atlas_world_assets/*.glb GodotPrototype/assets/world/
      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GodotPrototype/assets/world/
          if git diff --cached --quiet; then echo "No asset changes."; else git commit -m "Generate Blender 3D world and wildlife assets"; git push; fi
      - name: Upload world asset pack
        uses: actions/upload-artifact@v4
        with:
          name: atlas-world-3d-assets
          path: GodotPrototype/assets/world/*.glb
          if-no-files-found: error
