name: Build ATLAS WILDS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Check Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/atlas-wilds-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-wilds-android-debug
          path: build/atlas-wilds-debug.apk
          if-no-files-found: error
          retention-days: 14
